build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

formatting:
  active: true
  android: true
  autoCorrect: false
  Indentation:
    active: true
    indentSize: 4
  NoWildcardImports:
    active: true
  PackageName:
    active: true
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

complexity:
  active: true
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
  PackageNaming:
    active: true
  ClassNaming:
    active: true
